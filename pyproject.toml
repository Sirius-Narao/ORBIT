[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.1.0"
description = "Open Research & Benchmarking Intelligence Toolkit"
dependencies = [
    "numpy",
    "matplotlib",
    "questionary",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
orbit = "orbit.cli.parser:main"