[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit"
version = "0.2.0"
description = "Open Research & Benchmarking Intelligence Toolkit"
requires-python = ">=3.11"  # tomllib (settings file)
dependencies = [
    "numpy",
    "matplotlib",
    "pillow",  # image columns in orbit import (also a matplotlib dependency)
    "questionary",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# MP4 output for orbit animate / orbit boundary --animate --mp4: bundles an
# ffmpeg binary, for machines without ffmpeg on PATH. GIF needs nothing extra.
video = [
    "imageio-ffmpeg",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
orbit = "orbit.cli.parser:main"